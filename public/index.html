<style>
  /* ---------- Baton brand tokens (taken from batonleads.com) ---------- */
  :root {
    --navy: #00406c;
    --midnight: #002036;
    --sky: #01ace4;
    --mist: #e6f7fc;
    --silver: #b3bcc3;
    --magenta: #bf1363;
    --green: #00a878;

    --bg: #ffffff;
    --bg-alt: #e6f7fc;
    --surface: #ffffff;
    --text: #00406c;
    --text-soft: #36607e;
    --rule: rgba(0, 64, 108, 0.16);
    --link: #006fa3;
    --tile: #e6f7fc;
    --tile-ink: #00406c;
    --focus: #01ace4;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #00131f;
      --bg-alt: #04263b;
      --surface: #082b42;
      --text: #eaf6fc;
      --text-soft: #b5cfdf;
      --rule: rgba(255, 255, 255, 0.16);
      --link: #57d6ff;
      --tile: rgba(87, 214, 255, 0.14);
      --tile-ink: #57d6ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #00131f;
    --bg-alt: #04263b;
    --surface: #082b42;
    --text: #eaf6fc;
    --text-soft: #b5cfdf;
    --rule: rgba(255, 255, 255, 0.16);
    --link: #57d6ff;
    --tile: rgba(87, 214, 255, 0.14);
    --tile-ink: #57d6ff;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--midnight); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: var(--midnight);
    z-index: 10;
  }
  img, svg { max-width: 100%; }
  a { color: var(--link); text-underline-offset: 3px; }
  a:focus-visible, .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  h1, h2, h3, p { margin: 0; }
  .wrap { width: min(1160px, 100% - 3rem); margin-inline: auto; }
  .skip { position: absolute; left: -999px; top: 0; background: #fff; color: var(--navy); padding: .5rem 1rem; z-index: 20; }
  .skip:focus { left: 1rem; top: 1rem; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    padding: .7rem 1.5rem; border-radius: 4px; border: 1.5px solid transparent;
    font: inherit; font-weight: 600; font-size: 1rem; line-height: 1.3; text-decoration: none; cursor: pointer;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn-light { background: var(--mist); color: var(--navy); }
  .btn-light:hover { background: #ffffff; }
  .btn-line { color: var(--link); border-color: currentColor; background: transparent; }
  .btn-line:hover { background: var(--tile); }
  .btn-magenta { background: var(--magenta); color: #fff; }
  .btn-magenta:hover { background: #a10f56; }

  /* ---------- Hero ---------- */
  .hero { background: var(--midnight); color: #fff; overflow: hidden; position: relative; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1.5rem; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .logo { display: inline-flex; align-items: center; gap: .55rem; font-weight: 600; font-size: 1.65rem; letter-spacing: -.01em; color: #fff; text-decoration: none; }
  .logo svg { width: 34px; height: 32px; }
  .brand-label { padding-left: 1rem; border-left: 1px solid rgba(255,255,255,.4); font-size: 1.05rem; color: #cfe8f5; }
  .topbar .login { color: #fff; font-weight: 600; text-decoration: none; padding: .4rem .2rem; white-space: nowrap; flex: none; }
  .topbar .login:hover { text-decoration: underline; }
  .hero-grid { position: relative; z-index: 1; padding-block: clamp(2.5rem, 7vw, 6rem) clamp(3.5rem, 9vw, 8rem); }
  .hero-copy { max-width: 44rem; }
  h1 { font-size: clamp(2.7rem, 6.4vw, 4.75rem); line-height: 1.04; font-weight: 600; letter-spacing: -.02em; }
  h1 .hl { display: block; color: var(--sky); }
  .lead { margin-top: 1.5rem; max-width: 34rem; font-size: clamp(1.1rem, 1.8vw, 1.3rem); color: #d7ecf7; }
  .jump { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
  .hero-art { position: absolute; top: 0; bottom: 0; right: max(1rem, calc((100vw - 1160px) / 2)); width: min(46vw, 560px); pointer-events: none; }
  .hero-art svg { display: block; width: 100%; height: 100%; }
  .swoosh { fill: none; stroke: var(--sky); stroke-width: 22; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.9s cubic-bezier(.45,.05,.25,1) .2s both; }
  .swoosh-ghost { fill: none; stroke: var(--sky); stroke-opacity: .12; stroke-width: 70; stroke-linecap: round; }
  .arrowhead { fill: var(--sky); animation: pop .35s ease-out 1.85s both; }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .swoosh, .arrowhead { animation: none; } }

  /* ---------- Sections ---------- */
  .section { padding-block: clamp(3.5rem, 8vw, 6.5rem); background: var(--bg); }
  .section.alt { background: var(--bg-alt); }
  h2 { font-size: clamp(1.9rem, 3.6vw, 2.75rem); line-height: 1.12; font-weight: 600; letter-spacing: -.015em; color: var(--text); }
  .intro { margin-top: 1rem; max-width: 38rem; color: var(--text-soft); }

  /* Methods */
  .methods { margin-top: 2.5rem; border-bottom: 1px solid var(--rule); }
  .method { display: grid; grid-template-columns: minmax(170px, 250px) minmax(0, 1fr) auto; gap: 1.5rem 3rem; align-items: start; padding-block: 2.25rem; border-top: 1px solid var(--rule); }
  .method-name { display: flex; align-items: center; gap: 1rem; font-size: 1.65rem; font-weight: 600; letter-spacing: -.01em; }
  .tile { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 10px; background: var(--tile); color: var(--tile-ink); flex: none; }
  .tile svg { width: 26px; height: 26px; }
  .method-body p { max-width: 36rem; color: var(--text-soft); }
  .method-body p strong { color: var(--text); font-weight: 600; }
  .method-action { padding-top: .1rem; }
  .tip { display: flex; gap: .9rem; margin-top: 1.25rem; padding: 1.1rem 1.25rem; max-width: 36rem; background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--sky); border-radius: 6px; }
  .tip svg { width: 24px; height: 24px; flex: none; margin-top: .15rem; color: var(--sky); }
  .tip strong { display: block; color: var(--text); font-weight: 600; margin-bottom: .2rem; }
  .tip p { color: var(--text-soft); font-size: 1rem; }
  .more { margin-top: 2rem; color: var(--text-soft); }
  .more strong { color: var(--text); font-weight: 600; }

  /* Pre-vetting */
  .split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 2.5rem clamp(2rem, 6vw, 5.5rem); align-items: start; }
  .split .tip { margin-top: 2rem; }
  .split-main > p.lede { color: var(--text-soft); max-width: 36rem; }
  .checks { list-style: none; margin: 1.5rem 0 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 1.1rem; padding-block: 1.5rem; border-top: 1px solid var(--rule); }
  .checks li:last-child { border-bottom: 1px solid var(--rule); }
  .checks svg { width: 36px; height: 36px; color: var(--green); }
  .checks h3 { font-size: 1.3rem; font-weight: 600; line-height: 1.25; color: var(--text); }
  .checks p { margin-top: .35rem; color: var(--text-soft); max-width: 34rem; }
  .split-main .close { margin-top: 1.5rem; max-width: 36rem; color: var(--text); font-weight: 500; }

  /* Invalidation band (navy in both themes) */
  .band { background: var(--navy); color: #fff; padding-block: clamp(3.5rem, 8vw, 6rem); }
  .band h2 { color: #fff; }
  .stack { display: grid; gap: 1.25rem; max-width: 40rem; }
  .stack p { color: var(--text-soft); }
  .band .big { font-size: clamp(1.5rem, 3vw, 2.2rem); line-height: 1.25; font-weight: 500; letter-spacing: -.01em; }
  .band p:not(.big) { color: #d3eaf6; }

  /* Account managers */
  .managers-copy { display: grid; gap: 1rem; max-width: 34rem; margin-top: 1.25rem; color: var(--text-soft); }
  .managers-copy a { font-weight: 500; }
  .managers .btn { margin-top: 1rem; justify-self: start; }
  .team { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  .team li { display: flex; align-items: center; gap: 1rem; padding: 1.25rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
  .avatar { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 600; font-size: 1.4rem; flex: none; }
  .team .who { font-weight: 600; font-size: 1.15rem; color: var(--text); line-height: 1.2; }
  .team .role { font-size: .95rem; color: var(--text-soft); }

  /* Sign-off */
  .signoff { background: var(--bg-alt); padding-block: clamp(3rem, 7vw, 5rem); }
  .signoff p { max-width: 44rem; font-size: clamp(1.25rem, 2.2vw, 1.65rem); line-height: 1.45; font-weight: 500; letter-spacing: -.005em; color: var(--text); }

  /* Footer */
  footer { background: var(--midnight); color: #cfe8f5; padding-block: 2.5rem; font-size: .95rem; }
  .foot { display: flex; flex-wrap: wrap; gap: 1.25rem 2rem; align-items: center; justify-content: space-between; }
  .foot nav { display: flex; flex-wrap: wrap; gap: .5rem 1.75rem; }
  footer a { color: #fff; }
  footer .logo { font-size: 1.4rem; }
  .fine { width: 100%; color: #9fc3d8; }

  /* ---------- Responsive ---------- */
  @media (max-width: 960px) {
    .hero-art { right: -3rem; bottom: -5rem; width: 72%; opacity: .35; }
    .method { grid-template-columns: 1fr; gap: 1rem; padding-block: 1.75rem; }
    .split { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    body { font-size: 1rem; }
    .wrap { width: min(1160px, 100% - 2rem); }
    .topbar { flex-wrap: nowrap; align-items: flex-start; }
    .brand { min-width: 0; gap: .25rem; }
    .brand-label { border-left: 0; padding-left: 0; width: 100%; }
    .team { grid-template-columns: 1fr; }
    .jump .btn { flex: 1 1 auto; }
  }

  /* ---------- Loading + shared tweaks ---------- */
  html.loading body { background: var(--midnight); }
  html.loading #app { visibility: hidden; }
  .method, .irow, .prow { position: relative; }
  .hero .addbtn { color: #57d6ff; border-color: #57d6ff; }
  .band .addbtn { color: #cfe8f5; border-color: #cfe8f5; }
  footer .addbtn { color: #fff; border-color: rgba(255,255,255,.6); }

  /* ---------- Editor mode ---------- */
  :root { --err: #b3261e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --err: #ff8a80; } }
  :root[data-theme="dark"] { --err: #ff8a80; }

  body.is-edit { padding-bottom: 11rem; }
  .is-edit .swoosh, .is-edit .arrowhead { animation: none; }
  .ed { border-radius: 3px; cursor: text; outline: 1px dashed transparent; outline-offset: 3px; transition: outline-color .15s ease; }
  .ed:hover { outline-color: rgba(1,172,228,.8); }
  .ed:focus { outline: 2px solid var(--sky); background: rgba(1,172,228,.1); }
  .ed:empty::before { content: attr(data-ph); opacity: .55; font-style: italic; }
  .btn .ed { min-width: 2ch; }

  .secwrap { position: relative; }
  .sectools { position: absolute; top: .75rem; right: .75rem; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: .25rem; background: #001a2d; padding: .3rem; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.35); max-width: calc(100% - 1.5rem); }
  .seclabel { color: #8fd8f2; font-size: .82rem; font-weight: 600; padding: 0 .5rem; }
  .sectools button, .sectools select, .itools button, .itools select {
    font: inherit; font-size: .82rem; font-weight: 600; line-height: 1; min-height: 32px; padding: .35rem .6rem;
    border: 1px solid rgba(255,255,255,.3); border-radius: 5px; background: transparent; color: #fff; cursor: pointer;
  }
  .sectools select, .itools select { background: #00263f; }
  .sectools button:hover:not(:disabled), .itools button:hover:not(:disabled) { background: rgba(255,255,255,.14); }
  .sectools button:disabled, .itools button:disabled { opacity: .35; cursor: not-allowed; }
  .sectools .danger, .itools .danger { color: #ff8a80; border-color: rgba(255,138,128,.55); }
  .is-hidden > section, .is-hidden > header { opacity: .38; filter: grayscale(.5); }
  .hiddenlabel { position: absolute; left: 1rem; top: .85rem; z-index: 6; background: #b3261e; color: #fff; padding: .25rem .6rem; border-radius: 4px; font-size: .85rem; font-weight: 600; }

  .itools { position: absolute; top: .25rem; right: .25rem; z-index: 4; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .2rem; background: #001a2d; padding: .2rem; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.35); max-width: 100%; }
  .prow .itools { top: -1.15rem; }
  .jb, .fl, .lw { position: relative; display: inline-block; }
  .lw { display: inline-flex; }
  .jb .itools { top: -2rem; right: 0; flex-wrap: nowrap; width: max-content; }
  .fl .itools { top: -2.2rem; right: 0; flex-wrap: nowrap; width: max-content; }
  .is-edit .foot nav { gap: 2.5rem 2.5rem; }
  .jump { row-gap: 2.25rem; }
  .linkbadge { position: absolute; top: -12px; right: -12px; z-index: 4; display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: var(--sky); color: #00131f; cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .linkbadge svg { width: 14px; height: 14px; }

  .addbtn { margin-top: 1rem; padding: .55rem 1rem; border: 1.5px dashed var(--link); border-radius: 6px; background: transparent; color: var(--link); font: inherit; font-weight: 600; cursor: pointer; }
  .addbtn:hover { background: var(--tile); }
  .addsec { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; padding-block: 2.5rem; }
  .addsec label { display: inline-flex; align-items: center; gap: .6rem; font-weight: 600; }
  .addsec select { font: inherit; padding: .5rem .7rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--text); }
  .addsec .addbtn { margin-top: 0; }

  .editbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .65rem 1rem calc(.65rem + env(safe-area-inset-bottom, 0px)); background: #001a2d; color: #fff; box-shadow: 0 -6px 24px rgba(0,0,0,.3); }
  .eb-title { font-size: 1rem; }
  .eb-status { font-size: .92rem; color: #9fd9ef; }
  .eb-spacer { flex: 1 1 auto; }
  .eb-btn { font: inherit; font-size: .92rem; font-weight: 600; line-height: 1.2; padding: .55rem .9rem; border: 1.5px solid rgba(255,255,255,.35); border-radius: 4px; background: transparent; color: #fff; cursor: pointer; text-decoration: none; }
  .eb-btn:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  .eb-btn.primary { background: var(--sky); border-color: var(--sky); color: #00131f; }
  .eb-btn.primary:hover:not(:disabled) { background: #3cc4f0; }
  .eb-btn:disabled { opacity: .45; cursor: not-allowed; }
  .eb-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  dialog { border: 0; border-radius: 10px; padding: 1.5rem; width: min(460px, 92vw); background: var(--surface); color: var(--text); font: inherit; }
  dialog::backdrop { background: rgba(0,19,31,.6); }
  dialog h2 { font-size: 1.4rem; }
  dialog label { display: grid; gap: .35rem; margin-top: 1rem; font-weight: 600; }
  dialog input, dialog select { font: inherit; font-weight: 400; padding: .6rem .7rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); color: var(--text); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.5rem; }
  dialog .eb-btn { color: var(--text); border-color: var(--rule); }
  dialog .eb-btn.primary { color: #00131f; border-color: var(--sky); }

  /* ---------- Login screen ---------- */
  .login-screen { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem; background: var(--midnight); }
  .login-card { display: grid; gap: .9rem; width: min(420px, 100%); padding: 2rem; border-radius: 10px; background: var(--surface); color: var(--text); }
  .login-card h1 { font-size: 1.7rem; letter-spacing: -.01em; }
  .login-card p { color: var(--text-soft); }
  .login-logo { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: 1.4rem; }
  .login-logo svg { width: 30px; height: 28px; }
  .login-card label { display: grid; gap: .35rem; font-weight: 600; }
  .login-card input { font: inherit; font-weight: 400; padding: .7rem .8rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); color: var(--text); }
  .login-card .login-err { min-height: 1.4em; color: var(--err); font-weight: 500; }
  .login-card .eb-btn { color: #00131f; border-color: var(--sky); }
  .login-card .eb-btn.big { padding: .8rem 1rem; font-size: 1rem; }
  .login-back { justify-self: center; color: var(--link); }

  @media (max-width: 560px) {
    .editbar { gap: .4rem; padding-inline: .75rem; }
    .eb-title { display: none; }
    .eb-status { flex: 1 1 100%; }
    .eb-spacer { display: none; }
    .eb-btn { padding: .5rem .7rem; font-size: .85rem; }
    body.is-edit { padding-bottom: 16rem; }
  }

  /* ---------- Fix: highlighted statement in the navy band must be full-strength white ---------- */
  .band .stack .big { color: #fff; }

  /* ---------- Logo, hero background, photos, image section ---------- */
  .brand { position: relative; }
  .logo-img { display: block; width: auto; max-width: min(62vw, 380px); object-fit: contain; }
  .logotools { top: 100%; left: 0; right: auto; margin-top: .4rem; z-index: 8; justify-content: flex-start; width: max-content; max-width: calc(100vw - 2rem); }
  .herotools { top: auto; bottom: 1rem; right: auto; left: max(1rem, calc((100vw - 1160px) / 2)); z-index: 8; max-width: calc(100vw - 2rem); }
  .rng { display: inline-flex; align-items: center; gap: .4rem; color: #cfe8f5; font-size: .8rem; font-weight: 600; }
  .rng input { width: 90px; }
  .avatar { overflow: hidden; position: relative; width: 64px; height: 64px; }
  .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .avatar-btn { position: absolute; inset: auto 0 0 0; border: 0; padding: .2rem 0; background: rgba(0,19,31,.75); color: #fff; font: inherit; font-size: .65rem; font-weight: 600; cursor: pointer; }
  .fig { margin: 1.75rem 0 0; display: grid; gap: .9rem; }
  .fig.narrow { max-width: 640px; }
  .fig.wide { max-width: 960px; }
  .fig.full { max-width: none; }
  .imgbox { position: relative; }
  .fig img { display: block; width: 100%; height: auto; border-radius: 10px; }
  .fig figcaption { color: var(--text-soft); font-size: .98rem; }
  .img-empty { display: grid; place-items: center; min-height: 220px; padding: 1rem; text-align: center; border: 2px dashed var(--rule); border-radius: 10px; color: var(--text-soft); }
  .imgtools { top: .6rem; right: .6rem; }
  .altline { font-size: .88rem; color: var(--text-soft); }

  /* ---------- Text style bar ---------- */
  .stylebar { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem .9rem; padding-bottom: .65rem; margin-bottom: .1rem; border-bottom: 1px solid rgba(255,255,255,.18); }
  .stylebar[hidden] { display: none; }

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => { u = String(u || "").trim(); return /^(https?:|mailto:|tel:|#|\/)/i.test(u) ? u : "#"; };

  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return "mailto:" + v;

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-edit-password": pw, ...(opts.headers || {}) } });
  let data = null; try { data = await res.json(); } catch { /* ignore */ }

}

async function save(force = false) {
  setStatus("Saving\u2026", true);
  try {
    const { res, data } = await api("/api/content", { method: "PUT", body: JSON.stringify({ content: deepTrim(state), baseUpdatedAt: updatedAt, force }) });
    if (res.status === 401) { setStatus("Session expired. Please log in again."); logout(); return; }
    if (res.status === 409) {
      setStatus("", false); updateBar();
      if (confirm("Someone else saved changes after you opened this page.\n\nOverwrite their changes with yours?")) return save(true);
      return;
    }
    if (!res.ok) { setStatus("Could not save: " + (data?.error || res.status)); return; }
    state = deepTrim(state); updatedAt = data.updatedAt; baseline = JSON.stringify(state); setStatus("", false); render();
    setStatus("Saved. The live site is updated.");
    setTimeout(() => { if (!isDirty()) { setStatus("", false); updateBar(); } }, 3500);
  } catch { setStatus("Could not save. Check your connection and try again."); }
}

function swapWithStyles(listPath, i, j) {
  const arr = get(listPath);
  if (j < 0 || j >= arr.length) return;
  swap(arr, i, j);
  shiftStyles(listPath, (x) => (x === i ? j : x === j ? i : x));
}
function removeWithStyles(listPath, i) {
  get(listPath).splice(i, 1);
  shiftStyles(listPath, (x) => (x === i ? null : x > i ? x - 1 : x));
}

const history = [], future = [];
function updateUndo() { const u = $("#undobtn"), r = $("#redobtn"); if (u) u.disabled = !history.length; if (r) r.disabled = !future.length; }
function snapshot() {
  const j = JSON.stringify(state);
  if (j !== history[history.length - 1]) { history.push(j); if (history.length > 80) history.shift(); }
  future.length = 0; updateUndo();
}
function undo() {
  const now = JSON.stringify(state); let prev = null;
  while (history.length) { const h = history.pop(); if (h !== now) { prev = h; break; } }
  if (prev) { future.push(now); state = JSON.parse(prev); render(); }
  updateUndo();
}
function redo() {
  const now = JSON.stringify(state);
  if (future.length) { history.push(now); state = JSON.parse(future.pop()); render(); }
  updateUndo();
}

let pendingImg = null;
function handleAction(b) {
  const act = b.dataset.act, i = +b.dataset.i, lp = b.dataset.list;
  if (act !== "link" && act !== "img") snapshot();
  const list = lp ? get(lp) : null;
  switch (act) {
    case "up": swapWithStyles(lp, i, i - 1); break;
    case "down": swapWithStyles(lp, i, i + 1); break;
    case "del": if (!confirm("Delete this item?")) return; removeWithStyles(lp, i); break;
    case "add": list.push(TPL[b.dataset.kind]()); break;
    case "tip": put(b.dataset.path, get(b.dataset.path) ? null : { title: "Pro tip", text: "Add your tip here." }); break;
    case "link": openLinkDialog(b.dataset.path); return;
    case "img": pendingImg = { path: b.dataset.path, max: +b.dataset.max || 1600 }; { const f = $("#filepick"); f.value = ""; f.click(); } return;
    case "img-clear": put(b.dataset.path, null); break;
    case "logo-reset": state.brand.logo = null; break;
    case "sec-up": swapWithStyles("sections", i, i - 1); break;
    case "sec-down": swapWithStyles("sections", i, i + 1); break;
    case "sec-hide": state.sections[i].visible = !state.sections[i].visible; break;
    case "sec-dup": {
      const c = clone(state.sections[i]); c.id = uid(c.type);
      if (c.type === "methods") c.data.items.forEach((it) => (it.id = uid("m")));
      state.sections.splice(i + 1, 0, c); dupStyles("sections", i); break;
    }
    case "sec-del": if (!confirm("Delete this whole section?\n\nTip: use Hide to keep it for later without showing it on the site.")) return; removeWithStyles("sections", i); break;
    case "add-sec": state.sections.push(newSection($("#newType").value)); break;
    default: return;
  }
  render();
}

// ---- Images: shrink in the browser, then upload to the site's own storage ----
async function prepareImage(file, max) {
  if (file.type === "image/svg+xml") {
    if (file.size > 1_000_000) throw new Error("That SVG is over 1 MB.");
    return file;
  }
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error("Please choose a PNG, JPG, WebP, GIF or SVG image.");
  if (file.type === "image/gif" && file.size <= 1_500_000) return file; // keep animation
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const toBlob = (type, q) => new Promise((r) => c.toBlob(r, type, q));
  let blob = file.type === "image/png" ? await toBlob("image/png") : await toBlob("image/webp", 0.88);
  if (blob && blob.size > 3_500_000) blob = await toBlob("image/webp", 0.8);
  if (!blob || blob.size > 4_000_000) throw new Error("That image is too large. Try a smaller one.");
  return blob;
}
async function uploadImage(file, max) {
  const blob = await prepareImage(file, max);
  const res = await fetch("/api/upload", { method: "POST", headers: { "content-type": blob.type, "x-edit-password": pw }, body: blob });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error("Session expired."); }
  if (!res.ok) throw new Error(data.error || "Upload failed (" + res.status + ")");
  return data.url;
}

  const sbar = $("#stylebar");
  sbar.addEventListener("mousedown", (e) => { if (!e.target.closest("select,input")) e.preventDefault(); }); // keep the text selected
  $("#swatches").addEventListener("click", (e) => { const b = e.target.closest(".sw"); if (b) applyStyle({ color: b.dataset.color || undefined }); });
  $("#sbcolor").addEventListener("input", (e) => applyStyle({ color: e.target.value }));
  $("#sbopacity").addEventListener("change", (e) => applyStyle({ opacity: +e.target.value }));
  $("#sbbold").addEventListener("click", () => applyStyle({ bold: !(state.styles[activePath] || {}).bold }));
  $("#sbreset").addEventListener("click", () => { if (activePath) { delete state.styles[activePath]; const el = document.querySelector(`[data-path="${activePath}"]`); if (el) el.removeAttribute("style"); syncStyleBar(); updateBar(); } });
  app.addEventListener("focusin", (e) => {
    const el = e.target.closest("[data-path]");
    if (el && el.isContentEditable) { snapshot(); showStyleBar(el.dataset.path); }
    else if (e.target.matches('input[data-act="range"]')) snapshot();
  });

  // Link words inside text: select them, then click "Link"
  const updateLinkBtn = () => {
    const b = $("#sblink"); if (!b) return;
    const ok = savedSel && document.contains(savedSel.el);
    const a = ok ? anchorOf(savedSel.range.startContainer, savedSel.el) : null;
    b.disabled = !(ok && (!savedSel.range.collapsed || a));
    b.textContent = a ? "Edit link" : "Link";
  };
  document.addEventListener("selectionchange", () => {
    const sel = getSelection(); if (!sel.rangeCount) return;
    const r = sel.getRangeAt(0), node = r.commonAncestorContainer;
    const field = (node.nodeType === 1 ? node : node.parentElement)?.closest("[data-path]");
    if (field && field.getAttribute("contenteditable") === "true") savedSel = { el: field, range: r.cloneRange() };
    else if (field) savedSel = null;
    updateLinkBtn();
  });
  $("#sblink").addEventListener("click", () => {
    if (!savedSel) return;
    const el = savedSel.el, range = savedSel.range.cloneRange();
    const anchor = anchorOf(range.startContainer, el);
    if (anchor && range.collapsed) range.selectNodeContents(anchor);
    openLinkDialog(null, { el, range, anchor });
  });
  // Keep text plain: no bold/italic shortcuts, no dropped-in content
  app.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && /^[biu]$/i.test(e.key) && e.target.closest("[data-path]")) e.preventDefault(); });
  app.addEventListener("drop", (e) => { if (e.target.closest("[data-path]")) e.preventDefault(); });

  // Undo / Redo
  $("#undobtn").onclick = undo; $("#redobtn").onclick = redo;
  document.addEventListener("keydown", (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.target.closest("[contenteditable],input,select,textarea,dialog")) return;
    const k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
  });
  document.addEventListener("mousedown", (e) => { if (!e.target.closest("#stylebar") && !e.target.closest("[data-path]")) hideStyleBar(); });
  $("#logoutbtn").onclick = () => { if (!isDirty() || confirm("You have unsaved changes. Log out anyway?")) logout(); };
  $("#discardbtn").onclick = async () => {
    if (isDirty() && !confirm("Discard all unsaved changes?")) return;
    snapshot(); const s = await loadServer(); state = s.content; updatedAt = s.updatedAt; baseline = JSON.stringify(state); render();
  };
  $("#resetbtn").onclick = () => { if (confirm("Replace everything in the editor with the original content?\n\nNothing goes live until you press Save changes.")) { snapshot(); state = normalize(clone(DEFAULT)); render(); } };
  $("#restorebtn").onclick = async () => {
    const { res, data } = await api("/api/content?version=previous");
    if (!res.ok || !data?.content) { alert("There is no previous version yet. One is kept after each save."); return; }
    if (confirm("Load the version from before the last save into the editor?\n\nNothing goes live until you press Save changes.")) { snapshot(); state = normalize(data.content); render(); }
  };
  $("#linkcancel").onclick = () => { inlineMode = null; $("#linkdlg").close(); };
  $("#linkjump").onchange = (e) => { if (e.target.value) $("#linkurl").value = e.target.value; };
  $("#linkform").onsubmit = () => {
    const raw = $("#linkurl").value.trim();
    if (inlineMode) {
      const job = inlineMode; inlineMode = null;
      if (raw) setTimeout(() => applyInline(job, normalizeUrl(raw)), 0);
      else if (job.anchor) setTimeout(() => applyInline(job, null), 0); // empty address = remove the link
      return;
    }
    snapshot(); put(linkPath, normalizeUrl(raw)); render();
  };
  $("#linkremove").onclick = () => { const job = inlineMode; inlineMode = null; $("#linkdlg").close(); setTimeout(() => applyInline(job, null), 0); };

  // Typing in any editable text updates the content object directly.
  app.addEventListener("input", (e) => {
    if (e.target.matches('input[data-act="range"]')) { liveRange(e.target); return; }
    const el = e.target.closest("[data-path]");
    if (!el || !el.isContentEditable) return;
    put(el.dataset.path, fieldText(el));
    updateBar();
  });
  app.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.closest("[data-path]")) e.preventDefault(); });
  app.addEventListener("paste", (e) => {
    if (!e.target.closest("[data-path]")) return;
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData("text/plain").replace(/\s*\n+\s*/g, " ");
    document.execCommand("insertText", false, t);
  });
  document.addEventListener("click", (e) => {
    if (e.target.closest("a") && !e.target.closest(".editbar")) e.preventDefault(); // links don't navigate while editing
    const b = e.target.closest("[data-act]");
    if (b && b.tagName === "BUTTON") handleAction(b);
  });
  document.addEventListener("change", (e) => {
    const el = e.target.closest("select[data-act]");
    if (!el) return;
    if (el.dataset.act) snapshot();
    if (el.dataset.act === "icon") { put(el.dataset.path, el.value); render(); }
    if (el.dataset.act === "style") { state.sections[+el.dataset.i].data.style = el.value; render(); }
    if (el.dataset.act === "width") { state.sections[+el.dataset.i].data.width = el.value; render(); }
  });
  window.addEventListener("beforeunload", (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });
}

/* ====================================================================
   Start
   ==================================================================== */
function done() { document.documentElement.classList.remove("loading"); }

async function startViewer() {
  let data = { content: null };
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 3500);
    const res = await fetch("/api/content", { cache: "no-store", signal: ctl.signal }); clearTimeout(t);
    if (res.ok) data = await res.json();
  } catch { /* fall back to the original content */ }
  try { state = normalize(data.content || clone(DEFAULT)); render(); }
  catch (err) { console.error(err); state = normalize(clone(DEFAULT)); render(); }
  done();
}

function showLogin(msg) {
  done();
  app.innerHTML = `<div class="login-screen"><form id="loginform" class="login-card">
    <div class="login-logo">${LOGO}<span>Baton</span></div>
    <h1>Edit this page</h1>
    <p>Enter the editing password to continue.</p>
    <label>Password<input id="pwinput" type="password" autocomplete="current-password" required autofocus></label>
    <p id="loginerr" class="login-err" role="alert">${esc(msg || "")}</p>
    <button class="eb-btn primary big" type="submit">Log in</button>
    <a class="login-back" href="/">Back to the site</a>
  </form></div>`;
  $("#loginform").onsubmit = async (e) => {
    e.preventDefault();
    const p = $("#pwinput").value; const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Checking\u2026";
    try {
      const res = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: p }) });
      if (res.ok) { sessionStorage.setItem("baton_pw", p); return startEditor(p); }
      const d = await res.json().catch(() => ({}));
      showLogin(d.error || "Could not log in.");
    } catch { showLogin("Could not reach the server. Check your connection."); }
  };
}

async function startEditor(password) {
  pw = password;
  const s = await loadServer();
  state = s.content; updatedAt = s.updatedAt; baseline = JSON.stringify(state);
  initEditor(); render(); done();
}

(async () => {
  if (!edit) return startViewer();
  const saved = sessionStorage.getItem("baton_pw");
  if (saved) {
    try {
      const res = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: saved }) });
      if (res.ok) return startEditor(saved);
    } catch { /* show login */ }
    sessionStorage.removeItem("baton_pw");
  }
  showLogin();
})();
})();

</script>
